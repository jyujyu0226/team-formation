name: keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
